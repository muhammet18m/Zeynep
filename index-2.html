<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>

/* =====================================================
   TEMEL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    cursor: pointer;

    background:
        radial-gradient(
            circle at 50% 50%,
            #ff9caf 0%,
            #ff758c 25%,
            #d94f73 55%,
            #591d48 100%
        );
}


/* =====================================================
   HOLOGRAM ALANI
===================================================== */

.hologram-space {

    position: fixed;

    inset: 0;

    overflow: hidden;

    perspective: 900px;

    perspective-origin: center;

    pointer-events: none;

    z-index: 0;
}


/* Hafif hologram ışığı */

.hologram-space::before {

    content: "";

    position: absolute;

    inset: -30%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.13),
            transparent 55%
        );

    animation: lightMove 8s ease-in-out infinite alternate;
}


@keyframes lightMove {

    0% {
        transform:
            translate3d(-5%, -3%, 0)
            scale(1);
    }

    100% {
        transform:
            translate3d(5%, 3%, 0)
            scale(1.15);
    }
}


/* =====================================================
   3D KALPLER
===================================================== */

.hologram-heart {

    position: absolute;

    left: 50%;
    top: 50%;

    font-size: var(--size);

    color: #fff;

    opacity: var(--opacity);

    transform-style: preserve-3d;

    filter:
        drop-shadow(
            0 0 5px rgba(255,255,255,.9)
        )
        drop-shadow(
            0 0 14px rgba(255,80,170,.9)
        )
        drop-shadow(
            0 0 30px rgba(255,50,150,.55)
        );

    animation:
        hologramRotate var(--rotate) linear infinite,
        hologramFloat var(--float) ease-in-out infinite alternate;

    animation-delay: var(--delay);

}


/*
    Kalbin kendi ekseni etrafında
    3D dönmesi
*/

@keyframes hologramRotate {

    0% {

        transform:
            translate3d(
                var(--x),
                var(--y),
                var(--z)
            )
            rotateY(0deg)
            rotateX(8deg)
            rotateZ(0deg);
    }

    50% {

        transform:
            translate3d(
                var(--x),
                var(--y),
                var(--z)
            )
            rotateY(180deg)
            rotateX(-8deg)
            rotateZ(5deg);
    }

    100% {

        transform:
            translate3d(
                var(--x),
                var(--y),
                var(--z)
            )
            rotateY(360deg)
            rotateX(8deg)
            rotateZ(0deg);
    }
}


/* Uzayda hafif süzülme */

@keyframes hologramFloat {

    0% {

        margin-top: -12px;

    }

    100% {

        margin-top: 12px;

    }
}


/* =====================================================
   HOLOGRAM ÇİZGİLERİ
===================================================== */

.scan-lines {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1;

    opacity: .12;

    background:

        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 5px,
            rgba(255,255,255,.25) 6px
        );

    mix-blend-mode: screen;
}


/* =====================================================
   ANA SAHNE
===================================================== */

.scene {

    position: relative;

    z-index: 5;

    text-align: center;

}


/* =====================================================
   ANA KALP
===================================================== */

.closed-heart {

    font-size: 120px;

    filter:

        drop-shadow(
            0 0 10px rgba(255,255,255,.9)
        )

        drop-shadow(
            0 0 25px rgba(255,50,130,.9)
        )

        drop-shadow(
            0 15px 35px rgba(80,0,40,.35)
        );

    animation: heartbeat 1.5s infinite;

    transition: .6s ease;

    user-select: none;
}


@keyframes heartbeat {

    0%,
    100% {

        transform: scale(1);

    }

    50% {

        transform: scale(1.12);

    }
}


/* Ana kalbin açılması */

.opening .closed-heart {

    animation:
        openHeart .9s forwards;
}


@keyframes openHeart {

    0% {

        transform:
            scale(1)
            rotateY(0deg);

        opacity: 1;
    }

    45% {

        transform:
            scale(1.5)
            rotateY(180deg);

    }

    100% {

        transform:
            scale(0)
            rotateY(360deg);

        opacity: 0;

    }
}


/* =====================================================
   MESAJ
===================================================== */

.message {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -30%);

    width: 100vw;

    opacity: 0;

    pointer-events: none;
}


.opening .message {

    animation:
        messageAppear 1.5s .5s forwards;
}


.message h1 {

    margin: 0;

    color: white;

    font-size:
        clamp(
            42px,
            12vw,
            82px
        );

    text-shadow:

        0 0 8px rgba(255,255,255,.9),

        0 0 20px rgba(255,100,180,.8),

        0 0 45px rgba(255,50,150,.6),

        0 6px 25px
        rgba(120,0,30,.25);

}


.message .big-heart {

    font-size: 65px;

    margin-top: 15px;

    filter:

        drop-shadow(
            0 0 10px white
        )

        drop-shadow(
            0 0 30px #ff3f9f
        );

    animation: heartbeat 1.2s infinite;

}


.message p {

    color: white;

    font-size: 17px;

    margin-top: 15px;

    opacity: .9;

}


@keyframes messageAppear {

    0% {

        opacity: 0;

        transform:
            translate(-50%, 30%)
            scale(.5);

    }

    70% {

        transform:
            translate(-50%, -55%)
            scale(1.08);

    }

    100% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);

    }
}


/* =====================================================
   "KALBE DOKUN" YAZISI
===================================================== */

.hint {

    color: white;

    margin-top: 25px;

    font-size: 15px;

    opacity: .85;

    text-shadow:
        0 0 10px rgba(255,255,255,.7);

}


.opening .hint {

    display: none;

}


/* =====================================================
   TIKLAMADA UÇAN KALPLER
===================================================== */

.floating-heart {

    position: fixed;

    pointer-events: none;

    font-size: 28px;

    z-index: 10;

    filter:

        drop-shadow(
            0 0 8px white
        )

        drop-shadow(
            0 0 15px #ff3f9f
        );

    animation:
        fly 2.5s ease-out forwards;

}


@keyframes fly {

    0% {

        transform:
            translate(-50%, -50%)
            scale(.3);

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    100% {

        transform:

            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )

            rotate(var(--r))

            scale(1.4);

        opacity: 0;

    }

}


/* =====================================================
   TELEFONLAR
===================================================== */

@media (max-width: 600px) {

    .closed-heart {

        font-size: 105px;

    }

    .hologram-heart {

        filter:

            drop-shadow(
                0 0 4px white
            )

            drop-shadow(
                0 0 10px #ff4ca5
            );

    }

}

</style>
</head>


<body>


<!-- =====================================================
     3D HOLOGRAM ALANI
===================================================== -->

<div
    class="hologram-space"
    id="hologramSpace">
</div>


<!-- Hologram tarama çizgileri -->

<div class="scan-lines"></div>


<!-- =====================================================
     ANA SAHNE
===================================================== -->

<div
    class="scene"
    id="scene"
>

    <div
        class="closed-heart"
        id="heart"
    >
        ❤️
    </div>


    <div class="hint">

        Kalbe dokun ❤️

    </div>


    <div class="message">

        <h1>
            Zeynepp Seni Seviyorum 
                 </h1> <h1> iyi geceler </h1>
        

        <div class="big-heart">

            ❤️

        </div>

        <p>
            ♡
        </p>

    </div>

</div>



<script>


/* =====================================================
   3D HOLOGRAM KALPLERİ
===================================================== */

const hologram =
    document.getElementById(
        "hologramSpace"
    );


const heartTypes = [

    "",
    "💗",
    "💕",
    "💖",
    "💓",
    "💘",
    "💞"

];


/*
    Kalp sayısı
*/

const HEART_COUNT = 55;


for (
    let i = 0;
    i < HEART_COUNT;
    i++
) {

    const heart =
        document.createElement("div");


    heart.className =
        "hologram-heart";


    heart.innerHTML =
        heartTypes[
            Math.floor(
                Math.random()
                * heartTypes.length
            )
        ];


    /*
        Ekranın merkezinden
        3D koordinatlar
    */

    const x =
        Math.random() * 1100 - 550;

    const y =
        Math.random() * 850 - 425;

    const z =
        Math.random() * 900 - 450;


    /*
        Boyut
    */

    const size =
        16 + Math.random() * 48;


    /*
        Şeffaflık
    */

    const opacity =
        .12 + Math.random() * .55;


    /*
        Dönüş süresi
    */

    const rotate =
        5 + Math.random() * 12;


    /*
        Süzülme süresi
    */

    const float =
        3 + Math.random() * 5;


    /*
        Başlangıç gecikmesi
    */

    const delay =
        Math.random() * -10;


    heart.style.setProperty(
        "--x",
        x + "px"
    );

    heart.style.setProperty(
        "--y",
        y + "px"
    );

    heart.style.setProperty(
        "--z",
        z + "px"
    );

    heart.style.setProperty(
        "--size",
        size + "px"
    );

    heart.style.setProperty(
        "--opacity",
        opacity
    );

    heart.style.setProperty(
        "--rotate",
        rotate + "s"
    );

    heart.style.setProperty(
        "--float",
        float + "s"
    );

    heart.style.setProperty(
        "--delay",
        delay + "s"
    );


    hologram.appendChild(
        heart
    );

}



/* =====================================================
   ANA KALP
===================================================== */

const scene =
    document.getElementById(
        "scene"
    );


const mainHeart =
    document.getElementById(
        "heart"
    );


let opened = false;


mainHeart.addEventListener(
    "click",
    function(e) {


        if (opened)
            return;


        opened = true;


        scene.classList.add(
            "opening"
        );


        /*
            Kalp patlaması
        */

        for (
            let i = 0;
            i < 45;
            i++
        ) {

            const floatingHeart =
                document.createElement(
                    "div"
                );


            floatingHeart.className =
                "floating-heart";


            floatingHeart.innerHTML =
                heartTypes[
                    Math.floor(
                        Math.random()
                        * heartTypes.length
                    )
                ];


            floatingHeart.style.left =
                e.clientX + "px";


            floatingHeart.style.top =
                e.clientY + "px";


            floatingHeart.style.setProperty(

                "--x",

                (
                    Math.random() * 700
                    - 350
                ) + "px"

            );


            floatingHeart.style.setProperty(

                "--y",

                (
                    Math.random() * 650
                    - 450
                ) + "px"

            );


            floatingHeart.style.setProperty(

                "--r",

                (
                    Math.random() * 360
                    - 180
                ) + "deg"

            );


            floatingHeart.style.fontSize =

                (
                    18
                    + Math.random() * 35
                ) + "px";


            document.body.appendChild(
                floatingHeart
            );


            setTimeout(
                () => {

                    floatingHeart.remove();

                },
                2600
            );

        }

    }

);

</script>

</body>
</html>
